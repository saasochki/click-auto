# Local development services. Production and staging use their own compose files on the VPS.
name: clickauto

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clickauto
      POSTGRES_PASSWORD: clickauto
      POSTGRES_DB: clickauto
    ports: ['5432:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clickauto']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redis:/data]

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: local-dev-master-key
      MEILI_ENV: development
    ports: ['7700:7700']
    volumes: [meili:/meili_data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clickauto
      MINIO_ROOT_PASSWORD: clickauto-local
    ports: ['9000:9000', '9001:9001']
    volumes: [minio:/data]

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    environment:
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: clickauto
      AWS_SECRET_ACCESS_KEY: clickauto-local
      IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
      IMGPROXY_ENABLE_AVIF_DETECTION: 'true'
    ports: ['8080:8080']
    depends_on: [minio]

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  postgres:
  redis:
  meili:
  minio:
